name: Shared project verification

on:
  workflow_call:
    inputs:
      package-manager:
        description: npm or pnpm
        required: false
        default: pnpm
        type: string
      node-version:
        required: false
        default: "22"
        type: string
      pnpm-version:
        required: false
        default: "11.17.0"
        type: string
      working-directory:
        required: false
        default: .
        type: string
      install-command:
        required: true
        type: string
      check-command:
        required: false
        default: ""
        type: string
      test-command:
        required: true
        type: string
      typecheck-command:
        required: false
        default: ""
        type: string
      build-command:
        required: true
        type: string
      evidence-command:
        required: false
        default: ""
        type: string
      publish-config-path:
        description: Optional repository-relative Baby2B publishing manifest path.
        required: false
        default: ""
        type: string
      policy-build-output-paths:
        description: Optional comma-separated repository-relative build output paths.
        required: false
        default: ""
        type: string
      static-first-output:
        description: Optional repository-relative production output for static-first verification.
        required: false
        default: ""
        type: string
      static-first-routes:
        description: Comma-separated public routes that must have readable route HTML.
        required: false
        default: ""
        type: string
      static-first-mode:
        description: Static-first delivery mode (ssg or edge-ssr).
        required: false
        default: ssg
        type: string
      static-first-rendering-manifest:
        description: Required rendering contract for edge-ssr mode.
        required: false
        default: ""
        type: string
      static-first-server-artifact:
        description: Required non-empty server bundle for edge-ssr mode.
        required: false
        default: ""
        type: string
      static-first-runtime-command:
        description: Project command that verifies SSR markers, route matrix, 404, asset passthrough, hydration, fallback, and delivery-aware base paths.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs['working-directory'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: inputs['package-manager'] == 'pnpm'
        with:
          version: ${{ inputs['pnpm-version'] }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs['node-version'] }}
          cache: ${{ inputs['package-manager'] }}
      - name: Install dependencies
        run: ${{ inputs['install-command'] }}
      - name: Static checks
        if: inputs['check-command'] != ''
        run: ${{ inputs['check-command'] }}
      - name: Tests
        run: ${{ inputs['test-command'] }}
      - name: Type check
        if: inputs['typecheck-command'] != ''
        run: ${{ inputs['typecheck-command'] }}
      - name: Production build
        run: ${{ inputs['build-command'] }}
      - name: Checkout static-first policy
        if: inputs['static-first-output'] != ''
        uses: actions/checkout@v4
        with:
          repository: Tiancheng-Xu/.github
          path: .shared-static-first-policy
          sparse-checkout: scripts/static-first-policy.mjs
      - name: Static-first rendering gate
        if: inputs['static-first-output'] != ''
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --root "${{ github.workspace }}"
            --output "${{ inputs['static-first-output'] }}"
            --routes "${{ inputs['static-first-routes'] }}"
            --mode "${{ inputs['static-first-mode'] }}"
          )
          if [[ -n "${{ inputs['static-first-rendering-manifest'] }}" ]]; then
            args+=(--rendering-manifest "${{ inputs['static-first-rendering-manifest'] }}")
          fi
          if [[ -n "${{ inputs['static-first-server-artifact'] }}" ]]; then
            args+=(--server-artifact "${{ inputs['static-first-server-artifact'] }}")
          fi
          node .shared-static-first-policy/scripts/static-first-policy.mjs "${args[@]}"
      - name: Require Edge SSR runtime matrix
        if: inputs['static-first-mode'] == 'edge-ssr' && inputs['static-first-runtime-command'] == ''
        run: |
          echo "edge-ssr requires static-first-runtime-command against the built server artifact" >&2
          exit 1
      - name: Static-first runtime matrix
        if: inputs['static-first-runtime-command'] != ''
        run: ${{ inputs['static-first-runtime-command'] }}
      - name: Resolve introduced commit range
        id: commit-range
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          null_sha=0000000000000000000000000000000000000000
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "$null_sha" ]] && \
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "range=$BASE_SHA..$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            git fetch --quiet --no-tags origin \
              "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            merge_base=$(git merge-base "$HEAD_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" || true)
            if [[ -n "$merge_base" && "$merge_base" != "$HEAD_SHA" ]]; then
              echo "range=$merge_base..$HEAD_SHA" >> "$GITHUB_OUTPUT"
            else
              echo "range=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Repository policy
        uses: Tiancheng-Xu/.github/.github/actions/verify-repository-policy@main
        with:
          owner-name: tiancheng-Xu
          revision: ${{ github.event.pull_request.head.sha || github.sha }}
          commit-range: ${{ steps.commit-range.outputs.range }}
          build-output-paths: ${{ inputs['policy-build-output-paths'] }}
      - name: Evidence contract
        if: inputs['evidence-command'] != ''
        run: ${{ inputs['evidence-command'] }}
      - name: Validate Baby2B publishing contract
        if: inputs['publish-config-path'] != ''
        uses: Tiancheng-Xu/.github/.github/actions/verify-baby2b-publish@main
        with:
          config-path: ${{ inputs['publish-config-path'] }}
