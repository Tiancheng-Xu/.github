name: Shared repository policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve introduced commit range
        id: commit-range
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          null_sha=0000000000000000000000000000000000000000
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "$null_sha" ]] && \
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "range=$BASE_SHA..$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            git fetch --quiet --no-tags origin \
              "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            merge_base=$(git merge-base "$HEAD_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" || true)
            if [[ -n "$merge_base" && "$merge_base" != "$HEAD_SHA" ]]; then
              echo "range=$merge_base..$HEAD_SHA" >> "$GITHUB_OUTPUT"
            else
              echo "range=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Verify repository policy
        uses: Tiancheng-Xu/.github/.github/actions/verify-repository-policy@main
        with:
          owner-name: tiancheng-Xu
          revision: ${{ github.event.pull_request.head.sha || github.sha }}
          commit-range: ${{ steps.commit-range.outputs.range }}
